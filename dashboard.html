<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CUBOCRAFT — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:   #1E40AF;
      --orange: #F59E0B;
      --navy:   #1E3A5F;
      --green:  #22C55E;
      --red:    #EF4444;
      --white:  #FFFFFF;
      --off:    #F8FAFC;
      --border: #E2E8F0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: #1A202C;
      line-height: 1.5;
      background: var(--off);
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────── */
    .site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      background: #fff;
      height: 60px;
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: 0.5px;
      text-decoration: none;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .header-user-info {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0;
    }

    .header-nombre {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--navy);
    }

    .header-role {
      font-size: 0.72rem;
      color: #9CA3AF;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .btn-logout {
      font-size: 0.78rem;
      font-weight: 600;
      color: #718096;
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 0.3rem;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-logout:hover { border-color: var(--red); color: var(--red); }

    /* ── Login ───────────────────────────────────────── */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 1.5rem 2rem;
    }

    .login-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }

    .login-heading {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 0.25rem;
      line-height: 1.1;
    }

    .login-sub {
      font-size: 0.88rem;
      color: #718096;
      margin-bottom: 1.75rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 1rem;
    }

    .field label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #4A5568;
    }

    .field input {
      padding: 0.65rem 0.9rem;
      border: 1.5px solid var(--border);
      border-radius: 0.4rem;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      color: #1A202C;
      transition: border-color 0.15s;
      outline: none;
    }

    .field input:focus { border-color: var(--blue); }

    .login-error {
      font-size: 0.82rem;
      color: var(--red);
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 0.35rem;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.75rem;
    }

    .btn-login {
      width: 100%;
      padding: 0.75rem;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 0.4rem;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 0.5rem;
    }

    .btn-login:hover { background: var(--blue); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .login-footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.78rem;
      color: #A0AEC0;
    }

    /* ── Dashboard ───────────────────────────────────── */
    .dash-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 80px 1.5rem 3rem;
    }

    .dash-header {
      margin-bottom: 2rem;
      display: flex;
      align-items: flex-end;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .dash-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--navy);
      line-height: 1;
    }

    .dash-badge {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--blue);
      background: #EEF2FF;
      border-radius: 9999px;
      padding: 0.25rem 0.75rem;
      margin-bottom: 0.2rem;
    }

    .dash-mes {
      font-size: 0.9rem;
      color: #718096;
      font-weight: 500;
      margin-bottom: 0.2rem;
    }

    /* ── Secciones ────────────────────────────────────── */
    .section {
      margin-bottom: 2rem;
    }

    .section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: #4A5568;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── KPI Grid ────────────────────────────────────── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    @media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 500px) { .kpi-grid { grid-template-columns: 1fr; } }

    .kpi-card {
      background: #fff;
      border: 1px solid var(--border);
      border-top: 3px solid var(--border);
      border-radius: 0.6rem;
      padding: 1.25rem 1.1rem 1rem;
      position: relative;
      overflow: hidden;
    }

    .kpi-card.accent-blue   { border-top-color: var(--blue); }
    .kpi-card.accent-navy   { border-top-color: var(--navy); }
    .kpi-card.accent-orange { border-top-color: var(--orange); }
    .kpi-card.accent-green  { border-top-color: var(--green); }
    .kpi-card.accent-red    { border-top-color: var(--red); }

    .kpi-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
    }

    .kpi-value {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--navy);
      line-height: 1;
      margin-bottom: 0.3rem;
    }

    .kpi-sub {
      font-size: 0.75rem;
      color: #A0AEC0;
      font-weight: 500;
    }

    .kpi-icon {
      position: absolute;
      top: 0.9rem;
      right: 0.9rem;
      font-size: 1.3rem;
      opacity: 0.25;
    }

    /* ── Ranking ─────────────────────────────────────── */
    .ranking-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 0.6rem;
      overflow: hidden;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 3rem 1fr auto auto;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    .rank-row:last-child { border-bottom: none; }
    .rank-row:hover { background: var(--off); }
    .rank-row.rank-yo { background: #EEF2FF; }

    .rank-emoji {
      font-size: 1.5rem;
      text-align: center;
    }

    .rank-pos-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      color: #9CA3AF;
      text-align: center;
    }

    .rank-nombre {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--navy);
    }

    .rank-yo-tag {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--blue);
      background: #EEF2FF;
      border-radius: 9999px;
      padding: 0.1rem 0.4rem;
      margin-left: 0.4rem;
      vertical-align: middle;
    }

    .rank-total {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: #1A202C;
      text-align: right;
    }

    .rank-cat {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.65rem;
      border-radius: 9999px;
      text-align: center;
      min-width: 4.5rem;
    }

    .cat-oro    { background: #FEF3C7; color: #92400E; }
    .cat-plata  { background: #F1F5F9; color: #475569; }
    .cat-bronce { background: #FED7AA; color: #7C2D12; }
    .cat-other  { background: var(--border); color: #718096; }

    /* ── Mi posición (vendedor) ───────────────────────── */
    .myrank-card {
      background: #fff;
      border: 1px solid var(--border);
      border-left: 4px solid var(--blue);
      border-radius: 0.6rem;
      padding: 1.5rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .myrank-emoji { font-size: 3rem; line-height: 1; }

    .myrank-pos {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--navy);
    }

    .myrank-total {
      font-size: 0.9rem;
      color: #718096;
      margin-top: 0.2rem;
    }

    .myrank-nodata {
      color: #9CA3AF;
      font-size: 0.9rem;
      font-style: italic;
    }

    /* ── Campañas ────────────────────────────────────── */
    .campania-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }

    .campania-card {
      background: #fff;
      border: 1px solid var(--border);
      border-left: 4px solid var(--orange);
      border-radius: 0.5rem;
      padding: 1rem 1.1rem;
    }

    .campania-nombre {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 0.35rem;
    }

    .campania-desc {
      font-size: 0.82rem;
      color: #718096;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .campania-pct {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--orange);
    }

    .campania-vence {
      margin-top: 0.45rem;
      font-size: 0.72rem;
      color: #A0AEC0;
    }

    /* ── Loading ─────────────────────────────────────── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 3rem;
      color: #9CA3AF;
      font-size: 0.9rem;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 500px) {
      .rank-row { grid-template-columns: 2.5rem 1fr auto; }
      .rank-cat { display: none; }
      .login-card { padding: 1.75rem 1.25rem; }
    }
  </style>
</head>
<body>

<!-- ═══════════ HEADER ═══════════ -->
<header class="site-header">
  <div class="header-inner">
    <a href="/" class="header-logo">CUBOCRAFT</a>
    <div class="header-right" id="header-user" style="display:none">
      <div class="header-user-info">
        <span class="header-nombre" id="hd-nombre"></span>
        <span class="header-role"   id="hd-role"></span>
      </div>
      <button class="btn-logout" id="btn-logout">Cerrar sesión</button>
    </div>
  </div>
</header>

<!-- ═══════════ LOGIN ═══════════ -->
<main class="login-wrap" id="login-screen">
  <div class="login-card">
    <h1 class="login-heading">Dashboard</h1>
    <p class="login-sub">Ingresá tu WhatsApp y PIN para acceder</p>
    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="inp-phone">WhatsApp</label>
        <input type="tel" id="inp-phone" placeholder="5491XXXXXXXXX" inputmode="numeric" required />
      </div>
      <div class="field">
        <label for="inp-pin">PIN</label>
        <input type="password" id="inp-pin" placeholder="••••" maxlength="8" required />
      </div>
      <div class="login-error" id="login-error" style="display:none"></div>
      <button type="submit" class="btn-login" id="btn-login">Ingresar</button>
    </form>
    <p class="login-footer">CUBOCRAFT &copy; 2026</p>
  </div>
</main>

<!-- ═══════════ DASHBOARD ═══════════ -->
<main class="dash-wrap" id="dash-screen" style="display:none">
  <div id="dash-content">
    <div class="loading"><div class="spinner"></div> Cargando datos…</div>
  </div>
</main>

<script>
// ── Utilidades ──────────────────────────────────────────────────────────────

const MESES = ['enero','febrero','marzo','abril','mayo','junio',
               'julio','agosto','septiembre','octubre','noviembre','diciembre'];

function mesActual() {
  const now = new Date();
  return `${MESES[now.getMonth()].charAt(0).toUpperCase() + MESES[now.getMonth()].slice(1)} ${now.getFullYear()}`;
}

function subAnio() {
  const now = new Date();
  return `enero–${MESES[now.getMonth()]} ${now.getFullYear()}`;
}

function fmt(n) {
  if (n === null || n === undefined) return '—';
  const abs = Math.abs(Number(n));
  const formatted = abs.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (Number(n) < 0 ? '-$' : '$') + formatted;
}

function catClass(cat) {
  const c = (cat || '').toLowerCase();
  if (c === 'oro')    return 'cat-oro';
  if (c === 'plata')  return 'cat-plata';
  if (c === 'bronce') return 'cat-bronce';
  return 'cat-other';
}

function rankEmoji(pos) {
  return pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : `#${pos}`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Login ────────────────────────────────────────────────────────────────────

const loginScreen = document.getElementById('login-screen');
const dashScreen  = document.getElementById('dash-screen');
const dashContent = document.getElementById('dash-content');
const headerUser  = document.getElementById('header-user');
const hdNombre    = document.getElementById('hd-nombre');
const hdRole      = document.getElementById('hd-role');
const loginError  = document.getElementById('login-error');
const btnLogin    = document.getElementById('btn-login');
const btnLogout   = document.getElementById('btn-logout');

function showDash() {
  loginScreen.style.display = 'none';
  dashScreen.style.display  = '';
  headerUser.style.display  = '';
}

function showLogin() {
  dashScreen.style.display  = 'none';
  loginScreen.style.display = '';
  headerUser.style.display  = 'none';
}

function setHeaderUser(nombre, role) {
  hdNombre.textContent = nombre;
  hdRole.textContent   = role === 'supervisor' ? 'Supervisor' : 'Vendedor';
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const phone = document.getElementById('inp-phone').value.trim();
  const pin   = document.getElementById('inp-pin').value.trim();
  loginError.style.display = 'none';
  btnLogin.disabled = true;
  btnLogin.textContent = 'Verificando…';
  try {
    const res  = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, pin }),
    });
    const data = await res.json();
    if (!res.ok) {
      loginError.textContent  = data.error || 'Error al iniciar sesión';
      loginError.style.display = '';
    } else {
      setHeaderUser(data.nombre, data.role);
      showDash();
      loadDashboard();
    }
  } catch (err) {
    loginError.textContent  = 'Error de conexión. Intentá de nuevo.';
    loginError.style.display = '';
  } finally {
    btnLogin.disabled = false;
    btnLogin.textContent = 'Ingresar';
  }
});

btnLogout.addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  showLogin();
  document.getElementById('inp-pin').value = '';
  dashContent.innerHTML = '<div class="loading"><div class="spinner"></div> Cargando datos…</div>';
});

// ── Renderizado ──────────────────────────────────────────────────────────────

async function loadDashboard() {
  dashContent.innerHTML = '<div class="loading"><div class="spinner"></div> Cargando datos…</div>';
  try {
    const res  = await fetch('/api/dashboard-data');
    if (res.status === 401) { showLogin(); return; }
    const d = await res.json();
    setHeaderUser(d.nombre, d.role);
    if (d.role === 'supervisor') {
      dashContent.innerHTML = renderSupervisor(d);
    } else {
      dashContent.innerHTML = renderVendedor(d);
    }
  } catch (err) {
    dashContent.innerHTML = `<p style="color:var(--red);padding:2rem">Error cargando datos: ${esc(err.message)}</p>`;
  }
}

// ── Vista Supervisor ─────────────────────────────────────────────────────────

function renderSupervisor(d) {
  const mes   = mesActual();
  const anio  = subAnio();

  // KPI cards
  const kpiPend = d.pagos_pendientes > 0
    ? `<div class="kpi-card accent-orange">
         <div class="kpi-icon">⏳</div>
         <div class="kpi-label">Pagos a Confirmar</div>
         <div class="kpi-value">${d.pagos_pendientes}</div>
         <div class="kpi-sub">pendientes de revisión</div>
       </div>`
    : `<div class="kpi-card accent-green">
         <div class="kpi-icon">✅</div>
         <div class="kpi-label">Pagos Pendientes</div>
         <div class="kpi-value">0</div>
         <div class="kpi-sub">todos confirmados</div>
       </div>`;

  // Ranking rows
  const rankingRows = (d.ranking || []).map(r => `
    <div class="rank-row">
      <span class="rank-emoji">${rankEmoji(r.Posición)}</span>
      <span class="rank-nombre">${esc(r.Nombre)}</span>
      <span class="rank-total">${fmt(r.Total_Mes)}</span>
      <span class="rank-cat ${catClass(r.Categoría)}">${esc(r.Categoría)}</span>
    </div>`).join('');

  const rankingBlock = d.ranking && d.ranking.length
    ? `<div class="ranking-card">${rankingRows}</div>`
    : `<p style="color:#9CA3AF;font-size:.9rem">Sin pedidos este mes.</p>`;

  // Campañas
  const campBlock = (d.campanias || []).length
    ? `<div class="campania-grid">
        ${(d.campanias).map(c => `
          <div class="campania-card">
            <div class="campania-nombre">${esc(c.Nombre)}</div>
            <div class="campania-desc">
              <span class="campania-pct">${c.Descuento_Pct}%</span>
              de descuento
            </div>
            <div class="campania-vence">Vence: ${esc(c.Fecha_Fin)}</div>
          </div>`).join('')}
       </div>`
    : `<p style="color:#9CA3AF;font-size:.9rem">Sin campañas activas.</p>`;

  return `
    <div class="dash-header">
      <div>
        <div class="dash-badge">Panel Supervisor</div>
        <h1 class="dash-title">Resumen General</h1>
        <p class="dash-mes">${mes}</p>
      </div>
    </div>

    <section class="section">
      <h2 class="section-title">Mes en curso</h2>
      <div class="kpi-grid">
        <div class="kpi-card accent-blue">
          <div class="kpi-icon">📈</div>
          <div class="kpi-label">Total Ventas</div>
          <div class="kpi-value">${fmt(d.total_mes)}</div>
          <div class="kpi-sub">${d.cant_pedidos_mes} pedido${d.cant_pedidos_mes !== 1 ? 's' : ''}</div>
        </div>
        <div class="kpi-card accent-navy">
          <div class="kpi-icon">🛒</div>
          <div class="kpi-label">Pedidos</div>
          <div class="kpi-value">${d.cant_pedidos_mes}</div>
          <div class="kpi-sub">confirmados este mes</div>
        </div>
        ${kpiPend}
        <div class="kpi-card accent-green">
          <div class="kpi-icon">📅</div>
          <div class="kpi-label">Acumulado Año</div>
          <div class="kpi-value">${fmt(d.total_anio)}</div>
          <div class="kpi-sub">${anio}</div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Ranking del Mes</h2>
      ${rankingBlock}
    </section>

    <section class="section">
      <h2 class="section-title">Campañas Activas</h2>
      ${campBlock}
    </section>`;
}

// ── Vista Vendedor ───────────────────────────────────────────────────────────

function renderVendedor(d) {
  const mes  = mesActual();
  const anio = subAnio();
  const rank = d.ranking;

  // Mi posición
  let myRankHtml;
  if (rank) {
    myRankHtml = `
      <div class="myrank-card">
        <div class="myrank-emoji">${rankEmoji(rank.Posición)}</div>
        <div>
          <div class="myrank-pos">#${rank.Posición} en el ranking &nbsp;<span class="rank-cat ${catClass(rank.Categoría)}">${esc(rank.Categoría)}</span></div>
          <div class="myrank-total">${fmt(rank.Total_Mes)} vendidos este mes</div>
        </div>
      </div>`;
  } else {
    myRankHtml = `<div class="myrank-card"><p class="myrank-nodata">Sin pedidos registrados este mes.</p></div>`;
  }

  // Deuda: si es 0 o negativa (saldo a favor), mostrar en verde
  const deudaAccent = d.deuda_real > 0 ? 'accent-orange' : 'accent-green';
  const deudaLabel  = d.deuda_real > 0 ? 'Deuda Actual' : 'Saldo a Favor';

  return `
    <div class="dash-header">
      <div>
        <div class="dash-badge">Mi Dashboard</div>
        <h1 class="dash-title">${esc(d.nombre)}</h1>
        <p class="dash-mes">${mes}</p>
      </div>
    </div>

    <section class="section">
      <h2 class="section-title">Mi actividad del mes</h2>
      <div class="kpi-grid">
        <div class="kpi-card accent-blue">
          <div class="kpi-icon">📈</div>
          <div class="kpi-label">Ventas del Mes</div>
          <div class="kpi-value">${fmt(d.total_mes)}</div>
          <div class="kpi-sub">${d.cant_mes} pedido${d.cant_mes !== 1 ? 's' : ''}</div>
        </div>
        <div class="kpi-card accent-navy">
          <div class="kpi-icon">🛒</div>
          <div class="kpi-label">Pedidos</div>
          <div class="kpi-value">${d.cant_mes}</div>
          <div class="kpi-sub">este mes</div>
        </div>
        <div class="kpi-card ${deudaAccent}">
          <div class="kpi-icon">💳</div>
          <div class="kpi-label">${deudaLabel}</div>
          <div class="kpi-value">${fmt(Math.abs(d.deuda_real))}</div>
          <div class="kpi-sub">crédito disponible: ${fmt(d.disponible)}</div>
        </div>
        <div class="kpi-card accent-green">
          <div class="kpi-icon">📅</div>
          <div class="kpi-label">Acumulado Año</div>
          <div class="kpi-value">${fmt(d.total_anio)}</div>
          <div class="kpi-sub">${anio}</div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Mi posición en el ranking</h2>
      ${myRankHtml}
    </section>`;
}

// ── Inicialización ───────────────────────────────────────────────────────────

(async function init() {
  // Intentar cargar datos de sesión existente
  try {
    const res = await fetch('/api/dashboard-data');
    if (res.ok) {
      const d = await res.json();
      setHeaderUser(d.nombre, d.role);
      showDash();
      if (d.role === 'supervisor') {
        dashContent.innerHTML = renderSupervisor(d);
      } else {
        dashContent.innerHTML = renderVendedor(d);
      }
    }
    // else: 401 → muestra login (default)
  } catch (_) {
    // red error → muestra login
  }
})();
</script>

</body>
</html>
