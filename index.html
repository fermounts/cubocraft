<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CUBOCRAFT — Soluciones técnicas para construcción</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --steel:    #4A5568;
      --navy:     #1E3A5F;
      --blue:     #1E40AF;
      --orange:   #F59E0B;
      --green:    #25D366;
      --white:    #FFFFFF;
      --off-white:#F8FAFC;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--white);
      line-height: 1.6;
    }

    /* ── Utility ───────────────────────────────────── */

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* WhatsApp SVG icon */
    .wa-icon {
      width: 22px; height: 22px; fill: currentColor; flex-shrink: 0;
    }

    /* Stat blocks shared */
    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .stat {
      text-align: center;
      padding: 1rem 1.5rem;
      border-radius: 0.75rem;
      min-width: 130px;
    }

    .stat-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.78rem;
      font-weight: 500;
      margin-top: 0.3rem;
      opacity: 0.85;
    }

    /* Feature columns */
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      width: 100%;
    }

    @media (max-width: 640px) {
      .features { grid-template-columns: 1fr; }
    }

    .feature {
      padding: 1.25rem;
      border-radius: 0.75rem;
      text-align: center;
    }

    .feature-icon {
      font-size: 2rem;
      margin-bottom: 0.6rem;
      display: block;
    }

    .feature h3 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .feature p {
      font-size: 0.82rem;
      opacity: 0.8;
      line-height: 1.5;
    }

    /* CTA button */
    .btn-wa {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.9rem 2.2rem;
      border-radius: 0.75rem;
      text-decoration: none;
      transition: filter 0.15s, transform 0.1s;
      cursor: pointer;
      border: none;
    }

    .btn-wa:hover  { filter: brightness(1.12); transform: translateY(-2px); }
    .btn-wa:active { transform: translateY(0); }

    /* Back button */
    .btn-back {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.15);
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.3);
      backdrop-filter: blur(8px);
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.55rem 1.2rem;
      border-radius: 9999px;
      text-decoration: none;
      display: none;
      align-items: center;
      gap: 0.4rem;
      z-index: 100;
      transition: background 0.15s;
    }

    .btn-back:hover { background: rgba(255,255,255,0.25); }

    /* ══════════════════════════════════════════════
       SECCIÓN 1 — HUB
    ══════════════════════════════════════════════ */

    #hub {
      min-height: 100vh;
      background: var(--white);
      color: #1A202C;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem 5rem;
      gap: 2.5rem;
      text-align: center;
    }

    .hub-logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(3rem, 10vw, 5.5rem);
      font-weight: 800;
      color: #1E3A5F;
      letter-spacing: -1px;
      line-height: 1;
    }

    .hub-tagline {
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: #4A5568;
      font-weight: 500;
      max-width: 420px;
    }

    .hub-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      width: 100%;
      max-width: 700px;
    }

    @media (max-width: 520px) {
      .hub-cards { grid-template-columns: 1fr; }
    }

    .hub-card {
      border-radius: 1.25rem;
      padding: 2.5rem 1.5rem 2rem;
      text-align: center;
      text-decoration: none;
      color: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .hub-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.18);
    }

    .hub-card.cubo  { background: var(--steel); }
    .hub-card.craft { background: var(--navy);  }

    .hub-card-emoji { font-size: 3.5rem; line-height: 1; }

    .hub-card-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      line-height: 1;
    }

    .hub-card-sub {
      font-size: 0.88rem;
      opacity: 0.85;
      font-weight: 500;
    }

    .hub-card-arrow {
      margin-top: 0.5rem;
      font-size: 1.4rem;
      opacity: 0.6;
    }

    /* ══════════════════════════════════════════════
       SECCIÓN 2 — CUBO
    ══════════════════════════════════════════════ */

    #cubo {
      min-height: 100vh;
      background: var(--steel);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 5rem 1.5rem 7rem;
      gap: 2.5rem;
      text-align: center;
    }

    .cubo-header h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(2.2rem, 7vw, 3.5rem);
      font-weight: 800;
      letter-spacing: 0.5px;
      line-height: 1.05;
    }

    .cubo-header h2 span { color: #60A5FA; }

    .cubo-header p {
      margin-top: 0.6rem;
      font-size: 1.05rem;
      opacity: 0.85;
      font-style: italic;
    }

    .cubo-features .feature  { background: rgba(255,255,255,0.08); }

    .cubo-stats .stat        { background: rgba(30,64,175,0.35); border: 1px solid rgba(96,165,250,0.3); }
    .cubo-stats .stat-num    { color: #93C5FD; }

    .cubo-normas {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
    }

    .cubo-normas .tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      background: rgba(96,165,250,0.15);
      border: 1px solid rgba(96,165,250,0.35);
      color: #93C5FD;
      letter-spacing: 0.04em;
    }

    .btn-wa.cubo-btn {
      background: var(--blue);
      color: var(--white);
      box-shadow: 0 4px 20px rgba(30,64,175,0.5);
    }

    /* ══════════════════════════════════════════════
       SECCIÓN 3 — CRAFT
    ══════════════════════════════════════════════ */

    #craft {
      min-height: 100vh;
      background: var(--navy);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 5rem 1.5rem 7rem;
      gap: 2.5rem;
      text-align: center;
    }

    .craft-header h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(2.2rem, 7vw, 3.5rem);
      font-weight: 800;
      letter-spacing: 0.5px;
      line-height: 1.05;
    }

    .craft-header h2 span { color: var(--orange); }

    .craft-header p {
      margin-top: 0.6rem;
      font-size: 1.05rem;
      opacity: 0.85;
      font-style: italic;
    }

    .craft-features .feature { background: rgba(255,255,255,0.07); }

    .craft-stats .stat       { background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.3); }
    .craft-stats .stat-num   { color: var(--orange); }

    .craft-normas {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
    }

    .craft-normas .tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.35);
      color: var(--orange);
      letter-spacing: 0.04em;
    }

    .btn-wa.craft-btn {
      background: var(--orange);
      color: #1A202C;
      box-shadow: 0 4px 20px rgba(245,158,11,0.45);
    }

    /* ══════════════════════════════════════════════
       FOOTER
    ══════════════════════════════════════════════ */

    footer {
      background: var(--white);
      color: #4A5568;
      text-align: center;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .footer-logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--navy);
    }

    .footer-normas {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
    }

    .footer-normas span {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      background: #EDF2F7;
      color: #4A5568;
    }

    .footer-copy {
      font-size: 0.78rem;
      color: #A0AEC0;
    }

    /* ══════════════════════════════════════════════
       Sección visibility observer para btn-back
    ══════════════════════════════════════════════ */

    #btn-back-cubo, #btn-back-craft { display: none; }

    /* ══════════════════════════════════════════════
       UOCRA corner badge
    ══════════════════════════════════════════════ */

    @keyframes letterDrop {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .uocra-badge {
      position: fixed;
      bottom: 1.1rem;
      right: 1.2rem;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      pointer-events: none;
      user-select: none;
    }

    .uocra-label {
      font-family: 'Inter', sans-serif;
      font-size: 0.6rem;
      font-weight: 500;
      color: #A0AEC0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0;
      animation: letterDrop 0.4s ease forwards;
      animation-delay: 0.2s;
    }

    .uocra-word {
      display: flex;
      gap: 1px;
    }

    .uocra-word .l {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #CBD5E0;
      letter-spacing: 0.05em;
      opacity: 0;
      animation: letterDrop 0.35s ease forwards;
    }

    /* staggered delays — U O C R A */
    .uocra-word .l:nth-child(1) { animation-delay: 0.5s; }
    .uocra-word .l:nth-child(2) { animation-delay: 0.72s; }
    .uocra-word .l:nth-child(3) { animation-delay: 0.94s; }
    .uocra-word .l:nth-child(4) { animation-delay: 1.16s; }
    .uocra-word .l:nth-child(5) { animation-delay: 1.38s; }
</head>

<!-- Botón ↑ Volver (aparece en CUBO y CRAFT) -->

<a class="btn-back" id="btn-back-craft" href="#hub">↑ Volver al inicio</a>

<script>
  // Mostrar/ocultar botón "Volver" según sección visible
  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach(({ target, isIntersecting }) => {
        const id = target.id;
        if (id === 'cubo' || id === 'craft') {
          const btn = document.getElementById('btn-back-' + id);
          btn.style.display = isIntersecting ? 'inline-flex' : 'none';
        }
      });
    },
    { threshold: 0.15 }
  );

  ['cubo', 'craft'].forEach(id => observer.observe(document.getElementById(id)));
</script>
